name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test          # rgov-core selftest + unit tests (no node needed)
      - run: npm run build     # typecheck + the single-file app
      - name: Offline write-gate browser regressions
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROMIUM_PATH"
          npx playwright test --list
          npx playwright test tests/e2e/write-gate-offline.spec.ts --reporter=list
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: write-gate-traces, path: test-results, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        with: { name: rhogov-index-html, path: dist/index.html }
